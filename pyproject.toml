[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nisar-play"
version = "0.1.0"
description = "Exploration of NISAR (NASA-ISRO SAR) data products"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "xarray",
    "netCDF4",
    "matplotlib",
    "cartopy",
]

[project.scripts]
plot-sme2 = "nisar_play.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
